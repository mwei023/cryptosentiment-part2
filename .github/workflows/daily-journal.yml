# E006 daily journal — replaces the Celery beat schedule at $0.
#
# Why: Render background workers (Celery) have no free tier, and the
# journal needs FinBERT (torch) anyway — GitHub-hosted runners have
# 7 GB RAM, so the info arm runs comfortably here.
#
# What it does (same entry point as `python -m research.daily_report`):
#   1. settle yesterday's open arms against today's closes
#   2. log today's dual-arm rows for BTC/ETH/SOL
#   3. write research/results/E006/daily_reports/<today>.json
#   4. commit paper_journal.csv + the report; push.
# The push triggers a Render auto-deploy of the API, so /research/*
# endpoints serve fresh data from the committed files.
#
# Schedule: 00:05 UTC — the same time the old celery_worker.py beat
# entry used. NOTE: GitHub cron can drift by several minutes; the
# journal logic is date-based and idempotent, so drift is harmless.

name: daily-journal

on:
  schedule:
    - cron: "5 0 * * *"   # 00:05 UTC daily
  workflow_dispatch: {}   # manual re-runs (e.g. after CoinGecko flakiness)

permissions:
  contents: write

concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # FinBERT weights (~250 MB) — cache so runs don't re-download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-prosusai

      - name: Install backend dependencies
        working-directory: cryptosentiment/backend
        run: pip install -r requirements.txt

      - name: Run daily journal (settle + log + report)
        working-directory: cryptosentiment/backend
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          COINGECKO_API_URL: https://api.coingecko.com/api/v3
          # CI has no DATABASE_URL: daily_report.py must not require one
          # (it doesn't import database.py on this path).
          PYTHONUNBUFFERED: "1"
        run: python -m research.daily_report

      - name: Commit journal + report
        working-directory: cryptosentiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/paper_journal.csv backend/research/results/E006/daily_reports/
          if git diff --cached --quiet; then
            echo "No journal changes — nothing to commit (likely a rate-limited run; re-run manually if unexpected)."
          else
            git commit -m "journal: daily E006 run $(date -u +%F)"
            git push
          fi
